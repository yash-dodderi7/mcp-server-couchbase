# 1. Stop the Azure datasource from mapping the disk
datasource:
  Azure:
    disk_aliases:
      ephemeral0: None

# 2. Override and empty out the disk partitioning setup
disk_setup: null

# 3. Stop any automated formatting or filesystem creation
fs_setup: null

# 4. Prevent any mounting attempts
mounts:
  - [ ephemeral0, null ]
  - [ azure_resource, null ]

# 5. Actively nuke the existing partition table
runcmd:
  - [ sh, -c, 'TARGET_DISK=$(readlink -f /dev/disk/cloud/azure_resource); if [ -b "$TARGET_DISK" ]; then wipefs -a "$TARGET_DISK" && partprobe "$TARGET_DISK"; fi' ]
